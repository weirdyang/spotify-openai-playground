<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover Your Twitter Sound</title>
  <meta name="description" content="Turns your Twitter profile into music recommendations that match your personality.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1ED760;
      --primary-hover: #1FDF64;
      --bg: #121212;
      --surface: #181818;
      --surface-light: #282828;
      --text: #FFFFFF;
      --text-secondary: #B3B3B3;
      --border: #282828;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at top, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .search-box {
      background: transparent;
      border: none;
      padding: 0;
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
    }

    input {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-light);
      font-size: 1rem;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
        color: var(--text-secondary);
        opacity: 0.7;
    }

    input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(30, 215, 96, 0.2);
    }

    button {
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    #errorMessage {
      text-align: center;
      color: #FF5A5A;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .loader {
      display: none;
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .pulse {
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%,100% {transform: scale(0.9); opacity: 0.7;}
      50% {transform: scale(1.1); opacity: 1;}
    }

    .result-container {
      display: none;
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      animation: fadeIn 0.5s ease-out;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .profile-header {
      display: flex;
      align-items: center;
      padding: 1.25rem;
      background: var(--surface-light);
    }

    .profile-pic {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 1rem;
      border: 2px solid var(--bg);
    }

    .profile-info h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .profile-info p {
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: 500;
    }

    .song-container {
      padding: 1.5rem;
    }

    .song-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .song-card {
      display: flex;
      background: var(--surface-light);
      border-radius: 8px;
      overflow: hidden;
    }

    .album-cover {
      width: 120px;
      height: 120px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .song-details {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .song-title {
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 0.35rem;
    }

    .song-artist {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .spotify-button {
      display: inline-block;
      background: var(--primary);
      color: #000;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      align-self: flex-start;
      transition: background-color 0.2s, transform 0.2s;
    }

    .spotify-button:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      .input-group {
        flex-direction: column;
      }
      .song-card {
        /* Keep it flex but allow details to wrap if needed */
      }
      .album-cover {
        width: 100px;
        height: 100px;
      }
      .song-title {
        font-size: 1.05rem;
      }
      .song-artist {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="logo">TwitterSound</h1>
      <p class="tagline">Discover the music that matches your vibe</p>
    </header>

    <div class="search-box">
      <div class="input-group">
        <input type="text" id="twitterHandle" placeholder="Enter Twitter handle (e.g., elonmusk)">
        <button id="discoverBtn">Discover</button>
      </div>
      <p id="errorMessage" style="display: none;"></p>
    </div>

    <div id="loader" class="loader">
      <div class="pulse"></div>
      Analyzing your Twitter personality...
    </div>

    <div id="resultContainer" class="result-container">
      <div class="profile-header">
        <img id="profilePic" class="profile-pic" src="" alt="Profile Picture">
        <div class="profile-info">
          <h2 id="handleDisplay"></h2>
          <p id="genreDisplay"></p>
        </div>
      </div>

      <div class="song-container">
        <div class="song-label">Your Personality's Soundtrack</div>
        <div class="song-card">
          <img id="albumCover" class="album-cover" src="" alt="Album Cover">
          <div class="song-details">
            <div id="songTitle" class="song-title"></div>
            <div id="songArtist" class="song-artist"></div>
            <a id="spotifyLink" class="spotify-button" href="#" target="_blank">Listen on Spotify</a>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>© 2025 · AI-powered Twitter Music Matcher</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const twitterHandleInput = document.getElementById('twitterHandle');
      const discoverBtn = document.getElementById('discoverBtn');
      const loader = document.getElementById('loader');
      const resultContainer = document.getElementById('resultContainer');
      const profilePic = document.getElementById('profilePic');
      const handleDisplay = document.getElementById('handleDisplay');
      const genreDisplay = document.getElementById('genreDisplay');
      const albumCover = document.getElementById('albumCover');
      const songTitle = document.getElementById('songTitle');
      const songArtist = document.getElementById('songArtist');
      const spotifyLink = document.getElementById('spotifyLink');
      const errorMessage = document.getElementById('errorMessage');

      discoverBtn.addEventListener('click', fetchData);
      twitterHandleInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          fetchData();
        }
      });

      async function fetchData() {
        const handle = twitterHandleInput.value.trim();
        errorMessage.style.display = 'none';

        if (!handle) {
          showError('Please enter a Twitter handle');
          return;
        }

        const cleanedHandle = handle.startsWith('@') ? handle.substring(1) : handle;

        loader.style.display = 'block';
        resultContainer.style.display = 'none';

        try {
          const response = await fetch(`/.netlify/functions/analyze?q=${cleanedHandle}`);
          if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || 'Failed to fetch data');
          }

          const data = await response.json();

          loader.style.display = 'none';
          profilePic.src = data.profile;
          handleDisplay.textContent = '@' + cleanedHandle;
          genreDisplay.textContent = data.genre;
          albumCover.src = data.song.img;
          songTitle.textContent = data.song.name;
          songArtist.textContent = data.song.artist;
          spotifyLink.href = data.song.url;

          resultContainer.style.display = 'block';
          resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

        } catch (error) {
          console.error('Error:', error);
          loader.style.display = 'none';
          showError(error.message || 'Could not analyze this Twitter profile. Please try another handle.');
        }
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
